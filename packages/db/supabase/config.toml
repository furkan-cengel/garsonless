project_id = "garsonless"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Masabu kodunuz: {{ .Code }}. Kimseyle paylasmayin."
max_frequency = "90s"

[auth.hook.send_sms]
enabled = true
uri = "http://host.docker.internal:54321/functions/v1/send-sms-hook"
secrets = "env(SEND_SMS_HOOK_SECRETS)"

[functions.send-sms-hook]
enabled = true
verify_jwt = false
import_map = "./functions/send-sms-hook/deno.json"
entrypoint = "./functions/send-sms-hook/index.ts"

[functions.send-email-hook]
enabled = true
# Auth'un Send Email Hook POST'u client JWT tasimaz — verify_jwt ACIK olursa
# hook 401 alir ve hic auth e-postasi gonderilemez. Guvenlik imzayla saglanir
# (standardwebhooks + SEND_EMAIL_HOOK_SECRET), JWT ile degil.
verify_jwt = false
import_map = "./functions/send-email-hook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/send-email-hook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/send-email-hook/*.html" ]

[functions.outbox-worker]
enabled = true
# The scheduled caller authenticates with OUTBOX_WORKER_SECRET rather than a
# browser JWT. Keep the function service-only and do not expose the secret.
verify_jwt = false
import_map = "./functions/outbox-worker/deno.json"
entrypoint = "./functions/outbox-worker/index.ts"

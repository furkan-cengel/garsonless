<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Üyelik & Sadakat — garsonless</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
  :root {
    --p-bg: #fdf9f4; --p-surface: #ffffff;
    --p-accent: #2e7d63; --p-accent-2: #246b54; --p-accent-soft: #e3f0ea; --p-cta: #ad3217;
    --p-gold: #c8922a; --p-gold-soft: #f6ecd6;
    --p-text: #1c1c19; --p-text-2: #6b7280; --p-text-3: #9ca3af;
    --p-line: #ece5da; --p-radius: 16px; --shell: #11100e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Hanken Grotesk', system-ui, sans-serif; background: var(--shell); color: var(--p-text); -webkit-font-smoothing: antialiased; letter-spacing: -0.006em; }

  @keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(46,125,99,.4); } 50% { box-shadow: 0 0 0 6px rgba(46,125,99,0); } }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes stampPop { 0% { transform: scale(0) rotate(-25deg); opacity: 0; } 60% { transform: scale(1.2) rotate(6deg); } 100% { transform: scale(1) rotate(-8deg); opacity: 1; } }
  @keyframes shimmer { from { background-position: -160% 0; } to { background-position: 260% 0; } }
  @keyframes countUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes ringExpand { 0% { transform: scale(.8); opacity: .5; } 100% { transform: scale(1.6); opacity: 0; } }
  @keyframes confettiDrop { 0% { transform: translateY(-10px) rotate(0); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(60px) rotate(240deg); opacity: 0; } }
  @keyframes glowPulse { 0%,100% { opacity: .5; } 50% { opacity: .9; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
const { useState, useEffect, useRef } = React;
const money = n => '₺' + n.toLocaleString('tr-TR');

/* ─── member data model ─── */
const MEMBER = {
  name: 'Furkan Yılmaz', first: 'Furkan', initials: 'FY',
  id: 'GRS-4F2A-91C',
  tier: 'Gümüş', tierIdx: 1,
  points: 480, pointsToNext: 520, // 1000 → Gold
  stamps: 7, stampGoal: 10,
  joined: 'Mart 2026', visits: 23,
  table: 'Masa 5',
};
const TIERS = [
  { name: 'Bronz',  min: 0,    color: '#b87333', soft: '#f3e7dc' },
  { name: 'Gümüş',  min: 500,  color: '#8a9099', soft: '#eceef0' },
  { name: 'Altın',  min: 1000, color: '#c8922a', soft: '#f6ecd6' },
  { name: 'Platin', min: 2500, color: '#5b7a86', soft: '#e3edf0' },
];
const REWARDS = [
  { id: 1, emoji: '☕', name: 'Ücretsiz Filtre Kahve', cost: 200, tag: 'Popüler' },
  { id: 2, emoji: '🍰', name: 'Günün Tatlısı', cost: 350, tag: null },
  { id: 3, emoji: '🥐', name: 'Taze Kruvasan', cost: 150, tag: null },
  { id: 4, emoji: '🎁', name: '%20 İndirim Kuponu', cost: 500, tag: 'Avantajlı' },
];
const ACTIVITY = [
  { emoji: '☕', t: 'Türk Kahvesi × 2', d: 'Bugün, 12:33', pts: '+24', stamp: true },
  { emoji: '🎁', t: 'Ödül kullanıldı — Kruvasan', d: 'Dün, 09:14', pts: '-150', stamp: false },
  { emoji: '🍔', t: 'Acımarka Burger', d: '12 Haz, 19:40', pts: '+33', stamp: true },
  { emoji: '⭐', t: 'Hoş geldin bonusu', d: '08 Mar, üyelik', pts: '+100', stamp: false },
];

/* ============================================================
   SCREEN 1 — JOIN / SIGN UP
   ============================================================ */
function JoinScreen({ onJoin, onSkip }) {
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [agree, setAgree] = useState(true);
  const valid = name.trim().length > 1 && phone.replace(/\D/g, '').length >= 10 && agree;
  return (
    <Screen>
      <StatusBar />
      {/* hero */}
      <div style={{ padding: '8px 22px 0', textAlign: 'center', animation: 'fadeSlide .5s ease both' }}>
        <div style={{ position: 'relative', width: 92, height: 92, margin: '14px auto 0' }}>
          <span style={{ position: 'absolute', inset: 0, borderRadius: '50%', border: '2px solid var(--p-accent)', animation: 'ringExpand 2.4s ease-out infinite' }} />
          <div style={{ position: 'absolute', inset: 0, borderRadius: '50%', background: 'linear-gradient(135deg, var(--p-accent), var(--p-accent-2))', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 42, boxShadow: '0 16px 36px -12px rgba(46,125,99,.6)' }}>☕</div>
        </div>
        <h1 style={{ fontSize: 26, fontWeight: 800, letterSpacing: '-0.025em', margin: '20px 0 0' }}>Acımarka Club'a katıl</h1>
        <p style={{ fontSize: 14.5, color: 'var(--p-text-2)', margin: '8px 0 0', lineHeight: 1.5 }}>Her siparişte puan & damga topla,<br/>10. kahveni bizden iç.</p>
      </div>
      {/* perk chips */}
      <div style={{ display: 'flex', gap: 8, justifyContent: 'center', flexWrap: 'wrap', padding: '20px 22px 0' }}>
        {[['☕','Damga topla'],['⭐','Puan kazan'],['🎁','Ödüller']].map((c,i)=>(
          <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 6, fontSize: 12.5, fontWeight: 600, color: 'var(--p-accent)', background: 'var(--p-accent-soft)', padding: '7px 12px', borderRadius: 99 }}>{c[0]} {c[1]}</span>
        ))}
      </div>
      {/* form */}
      <div style={{ flex: 1, padding: '24px 22px 0', display: 'flex', flexDirection: 'column', gap: 12 }}>
        <Field label="Ad Soyad" value={name} onChange={setName} placeholder="Furkan Yılmaz" />
        <Field label="Telefon" value={phone} onChange={setPhone} placeholder="0555 123 45 67" type="tel" />
        <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginTop: 4, cursor: 'pointer' }}>
          <span onClick={() => setAgree(a => !a)} style={{ width: 22, height: 22, borderRadius: 7, flexShrink: 0, marginTop: 1, border: '2px solid ' + (agree ? 'var(--p-accent)' : 'var(--p-line)'), background: agree ? 'var(--p-accent)' : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 150ms' }}>
            {agree && <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 L10 17.5 L19 7" stroke="#fff" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" /></svg>}
          </span>
          <span style={{ fontSize: 12.5, color: 'var(--p-text-2)', lineHeight: 1.5 }}><b style={{ color: 'var(--p-text)' }}>Üyelik şartları</b> ve <b style={{ color: 'var(--p-text)' }}>KVKK aydınlatma metni</b>ni okudum, onaylıyorum.</span>
        </label>
      </div>
      {/* actions */}
      <div style={{ flexShrink: 0, padding: '14px 22px calc(14px + env(safe-area-inset-bottom, 16px))', display: 'flex', flexDirection: 'column', gap: 10 }}>
        <button onClick={() => valid && onJoin(phone)} disabled={!valid} style={{ width: '100%', height: 54, borderRadius: 'var(--p-radius)', border: 'none', background: valid ? 'var(--p-accent)' : 'var(--p-line)', color: valid ? '#fff' : 'var(--p-text-3)', fontSize: 16, fontWeight: 700, cursor: valid ? 'pointer' : 'not-allowed', fontFamily: 'inherit', transition: 'all 200ms' }}>
          Üye ol & 100 puan kazan
        </button>
        <button onClick={onSkip} style={{ width: '100%', height: 44, borderRadius: 'var(--p-radius)', border: 'none', background: 'none', color: 'var(--p-text-2)', fontSize: 14, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>Şimdilik geç</button>
      </div>
    </Screen>
  );
}
function Field({ label, value, onChange, placeholder, type = 'text' }) {
  const [focus, setFocus] = useState(false);
  return (
    <label style={{ display: 'block' }}>
      <span style={{ fontSize: 12.5, fontWeight: 600, color: 'var(--p-text-2)', marginLeft: 2 }}>{label}</span>
      <input value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} type={type}
        onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
        style={{ width: '100%', height: 50, marginTop: 6, padding: '0 14px', borderRadius: 'var(--p-radius)', fontSize: 15, fontFamily: 'inherit', color: 'var(--p-text)', background: 'var(--p-surface)', outline: 'none', border: '1.5px solid ' + (focus ? 'var(--p-accent)' : 'var(--p-line)'), boxShadow: focus ? '0 0 0 3px var(--p-accent-soft)' : 'none', transition: 'all 150ms' }} />
    </label>
  );
}

/* ============================================================
   SCREEN 1.5 — OTP VERIFICATION
   ============================================================ */
function OTPScreen({ phone, onVerify, onBack }) {
  const LEN = 6;
  const [digits, setDigits] = useState(Array(LEN).fill(''));
  const [secs, setSecs] = useState(38);
  const [err, setErr] = useState(false);
  const [verifying, setVerifying] = useState(false);
  const refs = useRef([]);

  useEffect(() => { if (refs.current[0]) refs.current[0].focus(); }, []);
  useEffect(() => {
    if (secs <= 0) return;
    const id = setInterval(() => setSecs(s => (s > 0 ? s - 1 : 0)), 1000);
    return () => clearInterval(id);
  }, [secs]);

  const code = digits.join('');
  const full = code.length === LEN && digits.every(d => d !== '');

  const submit = (val) => {
    setVerifying(true);
    setTimeout(() => {
      // demo: any 6 digits pass, but '000000' shows the error state
      if (val === '000000') { setErr(true); setVerifying(false); setDigits(Array(LEN).fill('')); refs.current[0] && refs.current[0].focus(); }
      else onVerify();
    }, 650);
  };

  const setAt = (i, v) => {
    v = v.replace(/\D/g, '');
    setErr(false);
    if (v.length > 1) { // paste
      const arr = v.slice(0, LEN).split('');
      const next = Array(LEN).fill('').map((_, k) => arr[k] || '');
      setDigits(next);
      const last = Math.min(arr.length, LEN) - 1;
      refs.current[last] && refs.current[last].focus();
      if (arr.length >= LEN) submit(next.join(''));
      return;
    }
    const next = [...digits]; next[i] = v; setDigits(next);
    if (v && i < LEN - 1) refs.current[i + 1] && refs.current[i + 1].focus();
    if (next.every(d => d !== '')) submit(next.join(''));
  };
  const onKey = (i, e) => {
    if (e.key === 'Backspace' && !digits[i] && i > 0) refs.current[i - 1] && refs.current[i - 1].focus();
  };

  return (
    <Screen>
      <StatusBar />
      <div style={{ padding: '4px 22px 0' }}>
        <button onClick={onBack} style={{ width: 38, height: 38, borderRadius: '50%', border: '1px solid var(--p-line)', background: 'var(--p-surface)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--p-text)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" /></svg>
        </button>
      </div>
      <div style={{ padding: '22px 22px 0', animation: 'fadeSlide .45s ease both' }}>
        <div style={{ width: 64, height: 64, borderRadius: 18, background: 'var(--p-accent-soft)', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 18 }}>
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><rect x="6" y="2.5" width="12" height="19" rx="3" stroke="var(--p-accent)" strokeWidth="1.9"/><path d="M10.5 18.5h3" stroke="var(--p-accent)" strokeWidth="1.9" strokeLinecap="round"/></svg>
        </div>
        <h1 style={{ fontSize: 25, fontWeight: 800, letterSpacing: '-0.025em', margin: 0 }}>Telefonunu doğrula</h1>
        <p style={{ fontSize: 14.5, color: 'var(--p-text-2)', margin: '8px 0 0', lineHeight: 1.5 }}>
          <b style={{ color: 'var(--p-text)' }}>{phone || '0555 ••• •• 67'}</b> numarasına 6 haneli kodu gönderdik.
        </p>
      </div>
      {/* OTP inputs */}
      <div style={{ padding: '26px 22px 0' }}>
        <div style={{ display: 'flex', gap: 9, justifyContent: 'space-between' }}>
          {digits.map((d, i) => (
            <input key={i} ref={el => refs.current[i] = el} value={d} inputMode="numeric" maxLength={LEN}
              onChange={e => setAt(i, e.target.value)} onKeyDown={e => onKey(i, e)}
              style={{
                width: 48, height: 58, textAlign: 'center', fontSize: 24, fontWeight: 800, fontFamily: 'inherit',
                color: 'var(--p-text)', background: 'var(--p-surface)', outline: 'none',
                borderRadius: 14, transition: 'all 150ms',
                border: '2px solid ' + (err ? 'var(--p-cta)' : d ? 'var(--p-accent)' : 'var(--p-line)'),
                boxShadow: d && !err ? '0 0 0 3px var(--p-accent-soft)' : 'none',
              }} />
          ))}
        </div>
        {err && <div style={{ fontSize: 13, color: 'var(--p-cta)', fontWeight: 600, marginTop: 12, display: 'flex', alignItems: 'center', gap: 6 }}>⚠ Kod hatalı, tekrar dene</div>}
        {/* resend */}
        <div style={{ marginTop: 18, fontSize: 13.5, color: 'var(--p-text-2)', textAlign: 'center' }}>
          {secs > 0
            ? <>Kodu almadın mı? <b style={{ color: 'var(--p-text-3)' }}>{secs}s</b> sonra tekrar gönder</>
            : <button onClick={() => { setSecs(38); setErr(false); }} style={{ background: 'none', border: 'none', color: 'var(--p-accent)', fontWeight: 700, fontSize: 13.5, cursor: 'pointer', fontFamily: 'inherit' }}>Kodu tekrar gönder</button>}
        </div>
        {/* demo hint */}
        <div style={{ marginTop: 14, padding: '10px 12px', background: 'var(--p-accent-soft)', borderRadius: 12, fontSize: 12, color: 'var(--p-accent-2)', textAlign: 'center', lineHeight: 1.5 }}>
          Demo: herhangi 6 hane doğrular · <b>000000</b> hatayı gösterir
        </div>
      </div>
      <div style={{ flex: 1 }} />
      <div style={{ flexShrink: 0, padding: '14px 22px calc(14px + env(safe-area-inset-bottom, 16px))' }}>
        <button onClick={() => full && submit(code)} disabled={!full || verifying} style={{ width: '100%', height: 54, borderRadius: 'var(--p-radius)', border: 'none', background: full && !verifying ? 'var(--p-accent)' : 'var(--p-line)', color: full && !verifying ? '#fff' : 'var(--p-text-3)', fontSize: 16, fontWeight: 700, cursor: full && !verifying ? 'pointer' : 'not-allowed', fontFamily: 'inherit', transition: 'all 200ms', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9 }}>
          {verifying ? <><Spinner /> Doğrulanıyor…</> : 'Doğrula & devam et'}
        </button>
      </div>
    </Screen>
  );
}
function Spinner() {
  return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style={{ animation: 'spin .7s linear infinite' }}><circle cx="12" cy="12" r="9" stroke="rgba(255,255,255,.35)" strokeWidth="3"/><path d="M21 12a9 9 0 0 0-9-9" stroke="#fff" strokeWidth="3" strokeLinecap="round"/></svg>;
}

/* ============================================================
   SCREEN 2 — MEMBER HOME (card, stamps, points, tier)
   ============================================================ */
function MemberHome({ data, onAddStamp, onOpenRewards, onOpenQR, justStamped }) {
  const tier = TIERS[data.tierIdx];
  const nextTier = TIERS[data.tierIdx + 1];
  const tierPct = nextTier ? Math.min(100, (data.points / nextTier.min) * 100) : 100;
  return (
    <Screen>
      <StatusBar />
      {/* header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '6px 20px 14px' }}>
        <div>
          <div style={{ fontSize: 12.5, color: 'var(--p-text-2)' }}>Sadakat kartın</div>
          <div style={{ fontSize: 21, fontWeight: 800, letterSpacing: '-0.02em' }}>Merhaba, {data.first} 👋</div>
        </div>
        <div style={{ width: 44, height: 44, borderRadius: '50%', background: 'linear-gradient(135deg, var(--p-accent), var(--p-accent-2))', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#fff', fontSize: 15, fontWeight: 800, boxShadow: '0 6px 16px -6px rgba(46,125,99,.5)' }}>{data.initials}</div>
      </div>

      <div style={{ flex: 1, overflowY: 'auto', padding: '0 16px 16px' }}>
        {/* membership card */}
        <div style={{ position: 'relative', borderRadius: 20, overflow: 'hidden', padding: 18, color: '#fff', background: 'linear-gradient(135deg, #2e7d63 0%, #1f5642 100%)', boxShadow: '0 18px 40px -16px rgba(46,125,99,.6)' }}>
          <div style={{ position: 'absolute', top: -40, right: -30, width: 150, height: 150, borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,255,255,.14), transparent 70%)' }} />
          <div style={{ position: 'absolute', inset: 0, background: 'linear-gradient(110deg, transparent 30%, rgba(255,255,255,.12) 45%, transparent 60%)', backgroundSize: '220% 100%', animation: 'shimmer 5s linear infinite' }} />
          <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', position: 'relative' }}>
            <div>
              <div style={{ fontSize: 11.5, opacity: .8, letterSpacing: '.1em', fontWeight: 600 }}>ACIMARKA CLUB</div>
              <div style={{ fontSize: 18, fontWeight: 800, marginTop: 4 }}>{data.name}</div>
              <div style={{ fontSize: 11.5, opacity: .7, marginTop: 2, fontFamily: 'monospace', letterSpacing: '.05em' }}>{data.id}</div>
            </div>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12, fontWeight: 700, background: 'rgba(255,255,255,.18)', backdropFilter: 'blur(4px)', padding: '5px 11px', borderRadius: 99 }}>
              <span style={{ width: 7, height: 7, borderRadius: '50%', background: tier.color }} />{tier.name}
            </span>
          </div>
          {/* tier progress */}
          <div style={{ marginTop: 18, position: 'relative' }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, opacity: .85, marginBottom: 6 }}>
              <span>{nextTier ? `${nextTier.name} seviyesine` : 'En üst seviye'}</span>
              <span>{nextTier ? `${data.points} / ${nextTier.min} puan` : '★'}</span>
            </div>
            <div style={{ height: 7, background: 'rgba(255,255,255,.2)', borderRadius: 99, overflow: 'hidden' }}>
              <div style={{ height: '100%', width: tierPct + '%', background: 'linear-gradient(90deg, #fff, #d9efe6)', borderRadius: 99, transition: 'width 700ms ease' }} />
            </div>
          </div>
          {/* QR strip */}
          <button onClick={onOpenQR} style={{ marginTop: 16, width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'rgba(255,255,255,.14)', border: '1px solid rgba(255,255,255,.18)', borderRadius: 12, padding: '10px 12px', cursor: 'pointer', fontFamily: 'inherit', color: '#fff' }}>
            <span style={{ display: 'inline-flex', alignItems: 'center', gap: 9, fontSize: 13, fontWeight: 600 }}>
              <QrGlyph size={20} color="#fff" /> Kasada okut, puan kazan
            </span>
            <span style={{ fontSize: 16 }}>→</span>
          </button>
        </div>

        {/* stats row */}
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginTop: 12 }}>
          <Stat icon="⭐" label="Puan" value={data.points} accent="var(--p-gold)" />
          <Stat icon="🏆" label="Ziyaret" value={data.visits} accent="var(--p-accent)" />
        </div>

        {/* stamp card */}
        <div style={{ marginTop: 12, background: 'var(--p-surface)', borderRadius: 'var(--p-radius)', border: '1px solid var(--p-line)', padding: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
            <div>
              <div style={{ fontSize: 15, fontWeight: 800 }}>Kahve Damgaların ☕</div>
              <div style={{ fontSize: 12.5, color: 'var(--p-text-2)', marginTop: 1 }}>{data.stampGoal - data.stamps} kahve daha, ödülün hazır!</div>
            </div>
            <div style={{ textAlign: 'right' }}>
              <span style={{ fontSize: 22, fontWeight: 800, color: 'var(--p-accent)' }}>{data.stamps}</span>
              <span style={{ fontSize: 14, color: 'var(--p-text-3)', fontWeight: 700 }}>/{data.stampGoal}</span>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 9 }}>
            {Array.from({ length: data.stampGoal }).map((_, i) => {
              const filled = i < data.stamps;
              const isReward = i === data.stampGoal - 1;
              const isNewest = justStamped && i === data.stamps - 1;
              return (
                <div key={i} style={{
                  aspectRatio: '1', borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 17,
                  background: filled ? 'var(--p-accent-soft)' : 'transparent',
                  border: filled ? '2px solid var(--p-accent)' : '2px dashed ' + (isReward ? 'var(--p-gold)' : 'var(--p-line)'),
                  animation: isNewest ? 'stampPop .5s cubic-bezier(.2,.9,.3,1.3) both' : 'none',
                  position: 'relative',
                }}>
                  {filled ? '☕' : isReward ? <span style={{ fontSize: 15 }}>🎁</span> : ''}
                </div>
              );

    </Screen>
  );
}

/* deterministic QR-like glyph */
function QrGlyph({ size = 80, color = '#000', detailed }) {
  const n = detailed ? 21 : 11;
  const cells = [];
  // pseudo-random but stable pattern
  let seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    const finder = (x < 3 && y < 3) || (x >= n - 3 && y < 3) || (x < 3 && y >= n - 3);
    if (finder) continue;
    if (rnd() > 0.55) cells.push([x, y]);
  }
  const c = size / n;
  const Finder = ({ fx, fy }) => (
    <g>
      <rect x={fx * c} y={fy * c} width={3 * c} height={3 * c} fill={color} />
      <rect x={(fx + 0.5) * c} y={(fy + 0.5) * c} width={2 * c} height={2 * c} fill="#fff" />
      <rect x={(fx + 1) * c} y={(fy + 1) * c} width={c} height={c} fill={color} />
    </g>
  );
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ display: 'block' }}>
      {cells.map(([x, y], i) => <rect key={i} x={x * c} y={y * c} width={c} height={c} fill={color} rx={c * 0.18} />)}
      <Finder fx={0} fy={0} /><Finder fx={n - 3} fy={0} /><Finder fx={0} fy={n - 3} />
    </svg>
  );
}

/* ============================================================
   APP
   ============================================================ */
function App() {
  const [data, setData] = useState(MEMBER);
  const [phase, setPhase] = useState('join'); // 'join' | 'otp' | 'member'
  const [phoneNum, setPhoneNum] = useState('');
  const [sheet, setSheet] = useState(null); // 'rewards' | 'qr'
  const [justStamped, setJustStamped] = useState(false);
  const [redeemed, setRedeemed] = useState(null);

  const join = (phone) => { setPhoneNum(phone); setPhase('otp'); };
  const verify = () => { setData(d => ({ ...d, points: 100, stamps: 0 })); setPhase('member'); };
  const addStamp = () => {
    setData(d => {
      let stamps = d.stamps + 1, points = d.points + 12;
      if (stamps >= d.stampGoal) { stamps = 0; points += 0; /* reward earned */ }
      return { ...d, stamps, points };
    });
    setJustStamped(true);
    setTimeout(() => setJustStamped(false), 600);
  };
  const redeem = (r) => {
    setData(d => ({ ...d, points: d.points - r.cost }));
    setSheet(null);
    setRedeemed(r);
    setTimeout(() => setRedeemed(null), 3200);
  };

  return (
    <div style={{ minHeight: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', padding: '22px 16px 50px' }}>
      {/* control bar */}
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: 'rgba(255,255,255,.5)', letterSpacing: '.08em' }}>ÜYELİK AKIŞI</div>
        <div style={{ display: 'inline-flex', background: 'rgba(255,255,255,.07)', border: '1px solid rgba(255,255,255,.12)', borderRadius: 99, padding: 4, gap: 2 }}>
          {[['Üye ol', 'join'], ['OTP', 'otp'], ['Üye paneli', 'member']].map(([t, p], i) => (
            <button key={i} onClick={() => setPhase(p)} style={{ padding: '8px 16px', borderRadius: 99, border: 'none', cursor: 'pointer', fontFamily: 'inherit', fontSize: 13, fontWeight: 600, background: phase === p ? 'var(--p-accent)' : 'transparent', color: phase === p ? '#fff' : 'rgba(255,255,255,.6)', transition: 'all 200ms' }}>{t}</button>
          ))}
        </div>
      </div>

      {/* phone */}
      <div style={{ width: 390, background: '#000', borderRadius: 50, padding: 11, boxShadow: '0 50px 100px -30px rgba(0,0,0,.6)' }}>
        <div style={{ position: 'relative', borderRadius: 40, overflow: 'hidden', height: 800, background: 'var(--p-bg)' }}>
          <div style={{ position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)', width: 130, height: 30, background: '#000', borderRadius: '0 0 18px 18px', zIndex: 45 }} />
          {phase === 'member'
            ? <MemberHome data={data} onAddStamp={addStamp} onOpenRewards={() => setSheet('rewards')} onOpenQR={() => setSheet('qr')} justStamped={justStamped} />
            : phase === 'otp'
            ? <OTPScreen phone={phoneNum} onVerify={verify} onBack={() => setPhase('join')} />
            : <JoinScreen onJoin={join} onSkip={() => setPhase('member')} />}
          {redeemed && <RedeemToast reward={redeemed} />}
          {sheet === 'rewards' && <RewardsSheet data={data} onClose={() => setSheet(null)} onRedeem={redeem} />}
          {sheet === 'qr' && <QRSheet data={data} onClose={() => setSheet(null)} />}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

name: Tables Runtime Gate

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"
  push:
    branches:
      - main
    paths:
      - "apps/dashboard/**"
      - "packages/application/**"
      - "packages/domain/**"
      - "packages/ui/**"
      - "packages/db/src/**"
      - "packages/db/supabase/migrations/**"
      - "tests/tables-runtime/**"
      - "scripts/verify-tables-settlement-rollback.mjs"
      - "scripts/tables-bundle-budget.mjs"
      - "scripts/tables-bundle-budget.test.mjs"
      - "scripts/dashboard-bundle-budget.mjs"
      - "scripts/dashboard-bundle-budget.test.mjs"
      - "package.json"
      - "playwright.tables-runtime.config.ts"
      - ".github/workflows/tables-runtime.yml"

permissions:
  contents: read

concurrency:
  group: tables-runtime-linked-dev
  cancel-in-progress: false

jobs:
  tables-regressions:
    name: Tables regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @garsonless/dashboard test:architecture
      - run: pnpm --filter @garsonless/dashboard typecheck
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/tables-db" --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Verify settlement rollback in PostgreSQL
        run: PGLITE_MODULE_PATH="$RUNNER_TEMP/tables-db/node_modules/@electric-sql/pglite/dist/index.js" node scripts/verify-tables-settlement-rollback.mjs

  linked-dev-runtime:
    name: Linked DEV transfer and browser gate
    # Fork PRs never receive DEV secrets; their pure regression job still runs.
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    needs: tables-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DEV_SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3010
      NEXT_PUBLIC_MENU_URL: https://menu.masabu.co
      NEXT_PUBLIC_MENU_BASE_URL: https://menu.masabu.co
      TABLES_RUNTIME_ALLOW_MUTATION: "1"
      TABLES_RUNTIME_DASHBOARD_URL: http://127.0.0.1:3010
      TABLES_RUNTIME_DB_EVIDENCE_PATH: test-results/tables-runtime/db-evidence.json
      TABLES_RUNTIME_BROWSER_EVIDENCE_PATH: test-results/tables-runtime/browser-evidence.json
      TABLES_RUNTIME_SCREENSHOT_DIR: test-results/tables-runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install runtime gate dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Typecheck database runtime suite
        run: pnpm --filter @garsonless/db typecheck

      - name: Run isolated transfer and payment gate
        run: pnpm test:tables-runtime

      - name: Build dashboard production bundle
        run: pnpm --filter @garsonless/dashboard build

      - name: Enforce Masalar route bundle budgets
        run: pnpm run check:tables-bundle-budget -- --output test-results/tables-runtime/bundle-budget-evidence.json

      - name: Enforce dashboard critical route bundle budgets
        run: pnpm run check:dashboard-bundle-budget -- --output test-results/tables-runtime/dashboard-bundle-budget-evidence.json

      - name: Run production browser and Realtime gate
        run: pnpm test:tables-browser-runtime

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tables-runtime-evidence
          path: test-results/tables-runtime
          if-no-files-found: error
          retention-days: 14
